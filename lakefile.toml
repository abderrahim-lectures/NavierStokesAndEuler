name = "NavierStokesAndEuler"
version = "0.2.0"
defaultTargets = ["NavierStokes", "Euler", "ComparatorChallenges"]

# Pinned to the toolchain shared by Mathlib and TauCeti:
#   Mathlib 2cabef97b63d3275776b8b060d802de6a6fa1055  (leanprover/lean4:v4.36.0-rc1)
#   TauCeti 97a5b23586f9c42610765c701daedc7522a93c26  (leanprover/lean4:v4.36.0-rc1, Mathlib 2cabef97)
[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "2cabef97b63d3275776b8b060d802de6a6fa1055"

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti.git"
rev = "97a5b23586f9c42610765c701daedc7522a93c26"

[[lean_lib]]
name = "NavierStokes"
globs = ["NavierStokes", "NavierStokes.+"]

[[lean_lib]]
name = "Euler"
leanOptions = { autoImplicit = false }
globs = ["Euler", "Euler.+"]

[[lean_lib]]
name = "ComparatorChallenges"
globs = ["ComparatorChallenges.+"]
